services:
  postgres-db:
    image: postgres:16-alpine
    container_name: riwitask_db
    environment:
      POSTGRES_DB: riwitask_db
      POSTGRES_USER: riwi_user
      POSTGRES_PASSWORD: riwi_pass
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: