<header class="bg-white shadow-sm">
  <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <div class="flex items-center gap-6">
      <a routerLink="/tasks" class="text-xl font-bold text-indigo-600">RiwiTask</a>

      <a
        routerLink="/tasks"
        routerLinkActive
        #tasksLink="routerLinkActive"
        class="border-b-2 pb-0.5 text-sm font-medium"
        [class]="
          tasksLink.isActive
            ? 'border-indigo-600 text-slate-900'
            : 'border-transparent text-slate-500 hover:text-slate-900'
        "
      >
        Tareas
      </a>

      @if (authService.isAdmin()) {
        <a
          routerLink="/clients"
          routerLinkActive
          #clientsLink="routerLinkActive"
          class="border-b-2 pb-0.5 text-sm font-medium"
          [class]="
            clientsLink.isActive
              ? 'border-indigo-600 text-slate-900'
              : 'border-transparent text-slate-500 hover:text-slate-900'
          "
        >
          Clientes
        </a>
      }
    </div>

    <div class="flex items-center gap-3 text-sm">
      <a routerLink="/profile" class="text-slate-600 hover:text-slate-900" title="Mi perfil">
        {{ authService.currentUser()?.name }}
        <span class="ml-1 rounded bg-indigo-100 px-1.5 py-0.5 text-xs font-semibold text-indigo-700">
          {{ authService.currentUser()?.role }}
        </span>
      </a>
      <button
        (click)="authService.logout()"
        class="rounded-lg bg-slate-800 px-3 py-1.5 text-white hover:bg-slate-900"
      >
        Cerrar sesión
      </button>
    </div>
  </nav>
</header>
